name: O3DE Private Windows Integration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Private runner mode"
        required: true
        default: "readiness"
        type: choice
        options:
          - readiness
          - fixture
          - integration_non_strict
          - integration_strict
      confirm_private_runner:
        description: "Type the private runner confirmation phrase"
        required: true
        type: string
      run_live_o3de_commands:
        description: "Allow future live O3DE commands on this private runner"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  private-o3de-integration:
    name: Private Windows O3DE integration
    runs-on: [self-hosted, Windows, X64, o3de, maxine-private]
    env:
      PRIVATE_RUNNER_CONFIRMATION: I_UNDERSTAND_THIS_REQUIRES_A_PRIVATE_SELF_HOSTED_WINDOWS_RUNNER

    steps:
      - name: Guard private runner confirmation
        shell: pwsh
        run: |
          if ("${{ inputs.confirm_private_runner }}" -ne "$env:PRIVATE_RUNNER_CONFIRMATION") {
            throw "Private runner confirmation phrase did not match."
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python version
        shell: pwsh
        run: python --version

      - name: Readiness report
        shell: pwsh
        run: python tools/ci/o3de_runner_readiness.py

      - name: Fixture suite
        if: ${{ inputs.mode == 'fixture' }}
        shell: pwsh
        run: python tools/ci/run_o3de_integration_suite.py --mode fixture

      - name: Block integration mode unless live command gate is explicit
        if: ${{ (inputs.mode == 'integration_non_strict' || inputs.mode == 'integration_strict') && inputs.run_live_o3de_commands == false }}
        shell: pwsh
        run: |
          Write-Host "Integration mode requested without run_live_o3de_commands=true; running readiness only and failing closed."
          python tools/ci/o3de_runner_readiness.py
          exit 1

      - name: Non-strict integration suite
        if: ${{ inputs.mode == 'integration_non_strict' && inputs.run_live_o3de_commands == true }}
        shell: pwsh
        env:
          MAXINE_ENABLE_O3DE_INTEGRATION: "1"
          MAXINE_ENABLE_ASSET_PROCESSOR_BATCH: "1"
          MAXINE_ENABLE_O3DE_EDITOR_SMOKE: "1"
          MAXINE_ALLOW_LIVE_O3DE_COMMANDS: "1"
        run: python tools/ci/run_o3de_integration_suite.py --enable-o3de-integration --allow-live-o3de-commands

      - name: Strict integration suite
        if: ${{ inputs.mode == 'integration_strict' && inputs.run_live_o3de_commands == true }}
        shell: pwsh
        env:
          MAXINE_ENABLE_O3DE_INTEGRATION: "1"
          MAXINE_ENABLE_ASSET_PROCESSOR_BATCH: "1"
          MAXINE_ENABLE_O3DE_EDITOR_SMOKE: "1"
          MAXINE_ALLOW_LIVE_O3DE_COMMANDS: "1"
        run: python tools/ci/run_o3de_integration_suite.py --enable-o3de-integration --strict-integration --allow-live-o3de-commands
